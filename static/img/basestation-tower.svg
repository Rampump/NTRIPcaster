<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="Base station">
  <defs>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64B5F6"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <filter id="towerShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="20" cy="37" rx="9.5" ry="2.2" fill="#0D47A1" opacity="0.22"/>

  <!-- tower body -->
  <path d="M20 6 L27 36 L13 36 Z" fill="url(#towerGrad)" stroke="#FFFFFF"
        stroke-width="1.6" stroke-linejoin="round" filter="url(#towerShadow)"/>

  <!-- cross bars -->
  <path d="M15.5 26 H24.5" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.92"/>
  <path d="M16.6 19 H23.4" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.92"/>
  <path d="M17.8 12.5 H22.2" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.92"/>

  <!-- signal source -->
  <circle cx="20" cy="6" r="4.2" fill="#FFC107" stroke="#FFFFFF" stroke-width="1.6"/>

  <!-- right waves -->
  <path d="M25.2 4.4 A7 7 0 0 1 25.2 7.6" fill="none" stroke="#FF7043"
        stroke-width="1.6" stroke-linecap="round"/>
  <path d="M28 3 A10.5 10.5 0 0 1 28 9" fill="none" stroke="#FF7043"
        stroke-width="1.4" stroke-linecap="round" opacity="0.72"/>

  <!-- left waves -->
  <path d="M14.8 4.4 A7 7 0 0 0 14.8 7.6" fill="none" stroke="#FF7043"
        stroke-width="1.6" stroke-linecap="round"/>
  <path d="M12 3 A10.5 10.5 0 0 0 12 9" fill="none" stroke="#FF7043"
        stroke-width="1.4" stroke-linecap="round" opacity="0.72"/>
</svg>
