# Docker Compose 生产环境配置
# 使用方法: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  ntrip-caster:
    # 生产环境配置
    image: ntripcaster:2.3.0
    # 使用预构建镜像：本文件不覆盖基础 compose 的 build 段，
    # 需要构建时请用 docker-compose.yml（或 build 后打 tag）
    environment:
      # 生产环境变量
      - LOG_LEVEL=INFO
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PYTHONOPTIMIZE=1
      # 数据库与日志必须落在持久卷内（覆盖基础 compose 的同名变量）
      - DATABASE_PATH=/app/data/2rtk.db
      - LOG_DIR=/app/logs
      - DATA_DIR=/app/data
    # 生产环境资源限制
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
      rollback_config:
        parallelism: 1
        delay: 0s
        failure_action: pause
        monitor: 60s
        max_failure_ratio: 0.3
    # 生产环境安全设置
    # 注意：compose 会把本文件与基础 compose 的列表合并，
    # 基础文件已有 no-new-privileges:true，这里只追加 apparmor
    security_opt:
      - apparmor:docker-default
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=50m
    # 生产环境健康检查
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    # 生产环境日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        compress: "true"
        labels: "service=ntrip-caster,environment=production"

  nginx:
    # 生产环境Nginx配置
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    # 生产环境SSL配置
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    # 生产环境健康检查
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  prometheus:
    # 生产环境Prometheus配置
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    # 生产环境数据保留
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--log.level=warn'
      - '--web.external-url=https://your-domain.com/prometheus/'
      - '--web.route-prefix=/'

  grafana:
    # 生产环境Grafana配置
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    environment:
      # 生产环境安全配置
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
      - GF_SERVER_ROOT_URL=https://your-domain.com/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_LOG_LEVEL=warn
    secrets:
      - grafana_admin_password

  redis:
    # 生产环境Redis配置
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    # 生产环境持久化配置
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300

# 生产环境密钥管理
secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt

# 生产环境网络配置
networks:
  ntrip-network:
    external: true
    name: ntrip-production-network

# 生产环境卷配置
# 注意：compose 的 override 只能"合并"不能"删除"键，
# 基础文件已经声明了 driver: local，这里若再写 external: true 会冲突
# （volumes.xxx: conflicting parameters "external" and "driver"）。
# 因此这里只覆盖卷名，卷由 compose 自动创建为 ntrip-production-*。
volumes:
  ntrip-data:
    name: ntrip-production-data
  ntrip-logs:
    name: ntrip-production-logs
  ntrip-config:
    name: ntrip-production-config
  prometheus-data:
    name: prometheus-production-data
  grafana-data:
    name: grafana-production-data
  nginx-cache:
    name: nginx-production-cache
  redis-data:
    name: redis-production-data