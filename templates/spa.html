<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name or '2RTK NTRIP Caster' }}</title>
    <link rel="icon" href="/static/favicon.ico">
    <!-- 本地样式表放最前：断网时页面仍是完整布局，不依赖 CDN -->
    <link rel="stylesheet" href="/static/theme.css?v={{ app_version }}">
    <!-- app.js 用的是 Font Awesome 5 的 `fas` 类名，这里必须引 5.x：
         原来引 4.7 只有 `fa`，页面上的图标全部渲染成空方块 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
    <!-- 地图库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <!-- i18n 必须在 app.js 之前加载：app.js 里的模板字符串直接调用全局 t() -->
    <script src="/static/i18n.js?v={{ app_version }}"></script>
</head>
<body>
    <header class="site-header">
        <div class="page">
            <div class="brand">
                <i class="fas fa-satellite-dish" aria-hidden="true"></i>
                <span class="brand-name">2RTK NTRIP</span>
                <span class="brand-sub" data-i18n="app.console">Caster Console</span>
            </div>

            <nav class="nav" aria-label="Main" data-i18n-aria="nav.main">
                <button type="button" class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')" data-i18n="nav.dashboard">Overview</button>
                <button type="button" class="nav-item" data-page="mounts" onclick="navigateTo('mounts')" data-i18n="nav.mounts">Mount Points</button>
                <button type="button" class="nav-item" data-page="users" onclick="navigateTo('users')" data-i18n="nav.users">Users</button>
                <button type="button" class="nav-item" data-page="monitor" onclick="navigateTo('monitor')" data-i18n="nav.monitor">Live Data</button>
                <button type="button" class="nav-item" data-page="settings" onclick="navigateTo('settings')" data-i18n="nav.settings">Settings</button>
                <button type="button" class="nav-item nav-donate" onclick="openDonateModal()" data-i18n-title="donate.open">
                    <i class="fas fa-heart" aria-hidden="true"></i>
                    <span data-i18n="nav.donate">Donate</span>
                </button>
                <button type="button" class="nav-item is-danger" onclick="logout()" data-i18n="nav.logout">Sign out</button>
            </nav>

            <div class="header-meta">
                <div class="lang-switch" role="group" aria-label="Language" data-i18n-aria="lang.label">
                    <button type="button" class="lang-btn" data-lang="zh" aria-pressed="false">中文</button>
                    <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
                </div>
                <span id="realtime-status" data-i18n="rt.connecting">Connecting…</span>
                <span class="status-dot" id="realtime-dot" title="Realtime channel" data-i18n-title="rt.channel"></span>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="page main-content">
            <div id="page-content"></div>

            <section class="content-panel" id="log-panel">
                <h3>
                    <i class="fas fa-terminal" aria-hidden="true"></i>
                    <span data-i18n="log.title">System Logs</span>
                </h3>
                <div class="log-terminal" id="log-terminal">
                    <div class="log-line info">[INFO] <span data-i18n="log.ready">Console connected, waiting for events…</span></div>
                </div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="page">
            <span id="app-name">{{ app_name or '2RTK NTRIP Caster' }}</span>
            <span>·</span>
            <span id="app-version">v{{ app_version or '2.2.0' }}</span>
            <span>·</span>
            <span>© {{ current_year or 2025 }} <span id="app-author">2RTK</span></span>
            <span>·</span>
            <a href="mailto:{{ contact_email or 'i@jia.by' }}" id="app-contact">{{ contact_email or 'i@jia.by' }}</a>
            <span>·</span>
            <a href="https://{{ website_url or '2RTK.COM' }}" id="app-website" target="_blank" rel="noopener">{{ website_url or '2RTK.COM' }}</a>
            <span>·</span>
            <a href="#" class="footer-donate" onclick="openDonateModal(); return false;" data-i18n="donate.open">Donate</a>
        </div>
    </footer>

    <!-- socket.io 客户端只需引入一次（头部已有 cdnjs 的 4.0.1，与 python-socketio 5.8 的
         Engine.IO v4 协议匹配）。这里原来又引入了 4.0.0，等于加载两份并以后者覆盖前者。 -->
    <script src="/static/app.js?v={{ app_version }}"></script>
</body>
</html>
