# NTRIP Caster Prometheus 配置
# 由 docker-deploy.sh 生成 / 也可直接作为仓库模板使用

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ntrip-caster'
    static_configs:
      - targets: ['ntrip-caster:5757']
    metrics_path: '/metrics'
    scrape_interval: 30s
